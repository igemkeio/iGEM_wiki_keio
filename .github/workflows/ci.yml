name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: E2Eのビジュアル回帰の基準画像をこの環境(Linux)で作り直し、artifactに上げる
        type: boolean
        default: false
  push:
    branches:
      - feature/vite-mpa
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:code

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  test-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:sync
      - run: npm run test:check

  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vercel 想定(base は /)
        run: WIKI_BASE=/ npm run build && WIKI_BASE=/ npm run check
      - name: GitLab Pages 想定(base は /keio/)
        run: WIKI_BASE=/keio/ npm run build && WIKI_BASE=/keio/ npm run check

  e2e:
    needs:
      - typecheck
      - test
      - test-scripts
      - build-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:e2e
      - name: E2E(基準画像の作り直し)
        if: ${{ inputs.update_snapshots }}
        continue-on-error: true
        run: npm run test:e2e -- --update-snapshots=all
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots }}
        with:
          name: e2e-snapshots
          path: web/e2e/**/*-snapshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # バージョンを上げるときは GITLEAKS_SHA256 も公式の checksums.txt の値に替える。
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # blob:none で blob を後取りにし、履歴の取得を軽くする。検査対象の範囲の blob だけが取得される。
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - name: gitleaks を取得してチェックサムを確かめる
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL --retry 3 -O "$base/$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
      - name: PR で増えるコミットを検査する
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git -v --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: 作業ツリーを検査する
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir -v --redact --no-banner .

  # ruleset の必須チェックはこのジョブだけにする。
  ci-passed:
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - test-scripts
      - build-check
      - e2e
      - gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: 依存ジョブがすべて成功したか確認する
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
