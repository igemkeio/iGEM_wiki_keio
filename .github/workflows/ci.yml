name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: E2Eのビジュアル回帰の基準画像をこの環境(Linux)で作り直し、artifactに上げる
        type: boolean
        default: false
  push:
    branches:
      - feature/vite-mpa
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:code

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  test-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:sync
      - run: npm run test:check

  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vercel 想定(base は /)
        run: WIKI_BASE=/ npm run build && WIKI_BASE=/ npm run check
      - name: GitLab Pages 想定(base は /keio/)
        run: WIKI_BASE=/keio/ npm run build && WIKI_BASE=/keio/ npm run check

  e2e:
    needs:
      - typecheck
      - test
      - test-scripts
      - build-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:e2e
      - name: E2E(基準画像の作り直し)
        if: ${{ inputs.update_snapshots }}
        continue-on-error: true
        run: npm run test:e2e -- --update-snapshots=all
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots }}
        with:
          name: e2e-snapshots
          path: web/e2e/**/*-snapshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 7

  # ruleset の必須チェックはこのジョブだけにする。
  ci-passed:
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - test-scripts
      - build-check
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: 依存ジョブがすべて成功したか確認する
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
