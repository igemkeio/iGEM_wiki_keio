name: Debug Secret Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check NOTION_SYNC_PAT presence
        env:
          PAT: ${{ secrets.NOTION_SYNC_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "NOTION_SYNC_PAT is SET (length=${#PAT})"
          else
            echo "NOTION_SYNC_PAT is EMPTY/UNSET"
          fi
      - name: Try API call with PAT
        env:
          PAT: ${{ secrets.NOTION_SYNC_PAT }}
        run: |
          curl -s -H "Authorization: Bearer $PAT" https://api.github.com/user | jq -r '.login, .message'
