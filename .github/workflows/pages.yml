name: Deploy static Flask (Frozen-Flask) to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 最速で進めるなら下2行は外す（キャッシュ警告を避けられる）
          # cache: 'pip'
          # cache-dependency-path: 'dependencies.txt'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r dependencies.txt

      - name: Build static site (flask freeze)
        env:
          FLASK_APP: app.py
        run: |
          python -m flask freeze
          test -f public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
