name: Deploy Frozen-Flask to GitHub Pages (no docs commit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r dependencies.txt

      - name: Freeze site (to public/)
        env:
          FLASK_APP: app.py
        run: |
          python -m flask freeze

      # 任意: 追加のビルド後処理（スクリプトがあれば実行; 無ければスキップ）
      - name: Optional post-build script
        run: |
          if [ -f build_site.py ]; then
            python3 build_site.py
          elif [ -f bulid_site.py ]; then
            python3 bulid_site.py
          else
            echo "No post-build script found; skipping."
          fi

      # docs/ を作るスクリプトの場合でも、コミットせずArtifactsに渡すだけ
      - name: Decide Pages artifact directory (docs/ or public/)
        id: find_dir
        run: |
          if [ -d docs ]; then
            echo "pages_dir=docs" >> $GITHUB_OUTPUT
          else
            echo "pages_dir=public" >> $GITHUB_OUTPUT
          fi
          # Jekyll無効化（サブフォルダやアンダースコア始まりの資産対策）
          touch "${{ github.workspace }}/${{ steps.find_dir.outputs.pages_dir }}/.nojekyll"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.pages_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
