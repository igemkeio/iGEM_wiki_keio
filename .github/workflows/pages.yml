name: Deploy static Flask (Frozen-Flask) to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.6はEOLなので、可能なら 3.10/3.11 を推奨
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dependencies.txt'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r dependencies.txt

      - name: Build static site (flask freeze)
        env:
          FLASK_APP: app.py
        run: |
          # どちらでも可（環境により前者推奨）
          python -m flask freeze
          # flask --app app.py freeze

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Frozen-Flask の出力先。あなたの .gitlab-ci.yml と同じ "public"
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
