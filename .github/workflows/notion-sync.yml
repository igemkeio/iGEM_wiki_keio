name: Notion Sync

# Notion の Database を取得し content/<locale>/<slug>.json を更新する。
# ビルドと check が通れば、差分をコミットして PR を作成する（main 直 push はしない）。

on:
  workflow_dispatch: # 手動実行
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC（= 09:00 JST）

permissions:
  contents: write
  pull-requests: write

# 同じトークンで並走すると Notion の rate limit に当たるため直列化する。
# 走行中のものは止めず、後から来たものを待たせる。
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run notion:sync

      # images-todo.json は gitignore 済みで PR に入らないため、件数と先頭 10 件をサマリーに出す。
      - name: Summarize images-todo
        run: |
          FILE=../content/images-todo.json
          {
            echo "## images-todo"
            if [ -f "$FILE" ]; then
              echo "static.igem.wiki 以外を指す画像: $(jq length "$FILE") 件"
              echo
              echo '```'
              jq -r '.[:10][] | "\(.locale)/\(.slug): \(.src)"' "$FILE"
              echo '```'
            else
              echo "images-todo.json が生成されませんでした。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 壊れた原稿を PR にしないよう、ここで落ちたら PR を作らずにジョブを失敗させる。
      - name: Build and check
        run: npm run build && npm run check

      - name: Create Pull Request on changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.NOTION_SYNC_PAT || github.token }}
          add-paths: |
            content/**
            web/public/notion-images/**
          commit-message: "chore: Notion の最新内容を反映するため content を同期。"
          branch: chore/notion-sync
          title: "chore: Notion 同期による content 更新"
          body: |
            Notion Database の内容を `content/<locale>/<slug>.json` に同期しました（自動生成）。
          delete-branch: true

      # PR が作られた場合のみ、Preview URL / PR URL / 実行時刻を Notion の __build__ 行へ書き戻す。
      # VERCEL_PREVIEW_URL は chore/notion-sync ブランチの固定 Preview URL（Vars か Secrets に設定）。
      - name: Write build status back to Notion
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUILD_PAGE_ID: ${{ secrets.NOTION_BUILD_PAGE_ID }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PREVIEW_URL: ${{ vars.VERCEL_PREVIEW_URL }}
        run: |
          [ -z "$BUILD_PAGE_ID" ] && { echo "NOTION_BUILD_PAGE_ID 未設定のためスキップ"; exit 0; }
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          # PREVIEW_URL が空なら JSON null（文字列ではなく）にする。
          if [ -n "$PREVIEW_URL" ]; then PREVIEW_JSON="\"$PREVIEW_URL\""; else PREVIEW_JSON="null"; fi
          curl -s -X PATCH "https://api.notion.com/v1/pages/$BUILD_PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"properties\":{\
              \"pr_url\":{\"url\":\"$PR_URL\"},\
              \"preview_url\":{\"url\":$PREVIEW_JSON},\
              \"last_synced\":{\"rich_text\":[{\"text\":{\"content\":\"$NOW\"}}]}\
            }}" -o /dev/null -w "Notion write: %{http_code}\n"
