name: Notion Sync

# Notion の Database を取得し wiki/pages/*.html を更新する。
# 差分があればコミットして PR を作成する（main 直 push はしない）。

on:
  workflow_dispatch: # 手動実行
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC（= 09:00 JST）

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: yarn notion:sync

      - name: Create Pull Request on changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: Notion の最新内容を反映するため wiki ページを同期。"
          branch: chore/notion-sync
          title: "chore: Notion 同期による wiki ページ更新"
          body: |
            Notion Database の内容を `wiki/pages/*.html` に同期しました（自動生成）。
          delete-branch: true

      # PR が作られた場合のみ、Preview URL / PR URL / 実行時刻を Notion の __build__ 行へ書き戻す。
      # VERCEL_PREVIEW_URL は chore/notion-sync ブランチの固定 Preview URL（Vars か Secrets に設定）。
      - name: Write build status back to Notion
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUILD_PAGE_ID: ${{ secrets.NOTION_BUILD_PAGE_ID }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PREVIEW_URL: ${{ vars.VERCEL_PREVIEW_URL }}
        run: |
          [ -z "$BUILD_PAGE_ID" ] && { echo "NOTION_BUILD_PAGE_ID 未設定のためスキップ"; exit 0; }
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          # PREVIEW_URL が空なら JSON null（文字列ではなく）にする。
          if [ -n "$PREVIEW_URL" ]; then PREVIEW_JSON="\"$PREVIEW_URL\""; else PREVIEW_JSON="null"; fi
          curl -s -X PATCH "https://api.notion.com/v1/pages/$BUILD_PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"properties\":{\
              \"pr_url\":{\"url\":\"$PR_URL\"},\
              \"preview_url\":{\"url\":$PREVIEW_JSON},\
              \"last_synced\":{\"rich_text\":[{\"text\":{\"content\":\"$NOW\"}}]}\
            }}" -o /dev/null -w "Notion write: %{http_code}\n"
