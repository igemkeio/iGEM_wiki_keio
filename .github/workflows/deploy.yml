name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r dependencies.txt
        
    - name: Build static site (GitLab style)
      run: |
        FLASK_APP=app.py flask freeze
        
    - name: Copy public to docs for GitHub Pages
      run: |
        rm -rf docs
        cp -r public docs
        
    - name: Commit and push to docs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        if ! git diff --staged --quiet; then
          git commit -m "Update docs from public [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
