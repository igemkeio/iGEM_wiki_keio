<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案内標識ナビ プロトタイプ</title>
<style>
  :root {
    --sky: #dfe8ee;
    --sky-deep: #b9cbd6;
    --pole: #f2f2f0;
    --pole-shade: #b8bcbd;
    --board: #ffffff;
    --board-edge: #cfd4d6;
    --ink: #1a1d1f;
    --sub: #5a6368;
    --blue: #2a6fb4;
    --green: #7ab53a;
    --shadow: 0 6px 14px rgba(20, 30, 40, .18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky), var(--sky-deep));
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  /* 標識全体: 支柱を中心に、板を左右へ振り分ける */
  .signpost {
    position: relative;
    width: min(760px, 100%);
    height: 520px;
  }
  .pole {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 22px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, var(--pole-shade), var(--pole) 40%, var(--pole) 70%, var(--pole-shade));
    border-radius: 11px 11px 2px 2px;
    box-shadow: var(--shadow);
  }
  .pole::before {
    content: "";
    position: absolute;
    top: -8px;
    left: -3px;
    right: -3px;
    height: 16px;
    border-radius: 50%;
    background: var(--pole);
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.15);
  }

  /* 板: 本体は水平のまま。向きは矢印と取り付け側で表現する */
  .board {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 300px;
    padding: 10px 14px;
    background: var(--board);
    border: 1px solid var(--board-edge);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .board:hover, .board:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 12px 22px rgba(20, 30, 40, .26);
    outline: none;
  }
  .board:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* 左向きの板: 支柱の左に出て、矢印は左端 */
  .board.left  { right: calc(50% + 6px); flex-direction: row; }
  /* 右向きの板: 支柱の右に出て、矢印は右端 */
  .board.right { left: calc(50% + 6px); flex-direction: row-reverse; text-align: right; }

  /* 板の先端を少し尖らせる */
  .board.left  { clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%); padding-left: 24px; }
  .board.right { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); padding-right: 24px; }

  /* 板ごとの色帯 (実物では施設種別で色が変わる) */
  .board::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 6px;
    background: var(--stripe, var(--blue));
  }
  .board.left::after  { right: 0; }
  .board.right::after { left: 0; }

  .arrow {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: var(--stripe, var(--blue));
    color: #fff;
    font-size: 24px;
    line-height: 1;
    border-radius: 4px;
  }
  .label { min-width: 0; }
  .ja {
    display: block;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .en {
    display: block;
    font-size: 12px;
    color: var(--sub);
    letter-spacing: .04em;
    margin-top: 2px;
  }

  /* 取り付け位置 */
  .b1 { top: 60px; }
  .b2 { top: 150px; }
  .b3 { top: 240px; }
  .b4 { top: 330px; }

  .caption {
    position: absolute;
    bottom: 0;
    left: 0;
    font-size: 12px;
    color: var(--sub);
  }

  /* スマホ: 支柱を左に寄せ、板を全部右向きの縦積みにする */
  @media (max-width: 680px) {
    .signpost { height: auto; padding: 24px 0 24px 32px; }
    .pole { left: 10px; transform: none; }
    .board, .board.left, .board.right {
      position: static;
      width: 100%;
      margin-bottom: 18px;
      flex-direction: row-reverse;
      text-align: right;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
      padding: 10px 24px 10px 14px;
    }
    .board::after, .board.left::after { left: 0; right: auto; }
    .caption { position: static; display: block; }
  }
</style>
</head>
<body>
<nav class="signpost" aria-label="サイト内の案内">
  <div class="pole" aria-hidden="true"></div>

  <a class="board left b1" href="#project" style="--stripe:#2a6fb4">
    <span class="arrow" aria-hidden="true">↖</span>
    <span class="label"><span class="ja">プロジェクト</span><span class="en">Project</span></span>
  </a>
  <a class="board right b2" href="#wetlab" style="--stripe:#2a6fb4">
    <span class="arrow" aria-hidden="true">→</span>
    <span class="label"><span class="ja">ウェットラボ</span><span class="en">Wet Lab</span></span>
  </a>
  <a class="board left b3" href="#human-practices" style="--stripe:#7ab53a">
    <span class="arrow" aria-hidden="true">←</span>
    <span class="label"><span class="ja">ヒューマンプラクティス</span><span class="en">Human Practices</span></span>
  </a>
  <a class="board right b4" href="#team" style="--stripe:#e07a2f">
    <span class="arrow" aria-hidden="true">↘</span>
    <span class="label"><span class="ja">チーム</span><span class="en">Team</span></span>
  </a>

  <p class="caption">板をクリックすると各セクションへ移動する想定。スマホ幅では縦積みに切り替わる。</p>
</nav>
</body>
</html>
