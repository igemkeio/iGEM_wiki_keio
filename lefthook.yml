$schema: ./web/node_modules/lefthook/schema.json

pre-commit:
  jobs:
    # oxlint --fixは整形を崩すことがあるので、oxlintのあとにoxfmtを流して整形を最終形にする。
    # 同じファイルを書き換えるため並列にせず直列で流す。
    # 設定側で除外したファイルだけがステージされたときに落ちないよう、
    # 両方に --no-error-on-unmatched-patternを付ける。
    - name: oxlint
      root: web/
      glob: "*.{ts,tsx,mjs}"
      run: npx oxlint --fix {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    - name: oxfmt
      root: web/
      glob: "*.{ts,tsx,mjs,css,json,md}"
      run: npx oxfmt --write {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    # tscはファイルを指定できないので、.tsと .tsxが含まれるときだけプロジェクト全体を検査する。
    - name: typecheck
      root: web/
      glob: "*.{ts,tsx}"
      run: npm run typecheck
